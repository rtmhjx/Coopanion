name: Refresh optional Task Supervisor to preview.2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task-supervisor-preview2-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'rtmhjx/Coopanion' && github.repository_owner == 'rtmhjx' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact previous PR head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5, Node 24
        with:
          repository: rtmhjx/Coopanion
          ref: b1bfbcea347472312dcd6a50e6dc29afa1adaf33
          fetch-depth: 2
          submodules: false
          lfs: false
          persist-credentials: true
      - name: Verify complete sealed source and refresh only the fixed contribution
        shell: bash
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_ATTR_NOSYSTEM: '1'
          GIT_LITERAL_PATHSPECS: '1'
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import re
          import stat
          import subprocess
          import unicodedata
          import zipfile
          from pathlib import Path, PurePosixPath
          
          REPOSITORY = 'rtmhjx/Coopanion'
          MAX_FILES = 0
          MAX_ARCHIVE_BYTES = 64 * 1024 * 1024
          MAX_EXPANDED_BYTES = 64 * 1024 * 1024
          MAX_FILE_BYTES = 8 * 1024 * 1024
          ARCHIVE_ROOT = 'cortico-world-task-supervisor-0.1.0-preview.2/'
          TREES = {'src', 'vendor', 'tools', 'tests', 'lib'}
          ROOT_FILES = {
              'package.json', 'package-lock.json', 'pnpm-lock.yaml',
              'tsconfig.vendor.json', 'README.md', 'README.zh-CN.md',
              'CHANGELOG.md', 'SECURITY.md', 'BUILDING.md', 'SOURCES.md',
              'LICENSE', 'NOTICE', 'THIRD-PARTY-LICENSES.txt',
              '.gitignore', '.gitattributes', '.npmignore',
              'console.js', 'console.d.ts', 'styles.css', 'describe.json',
          }
          REQUIRED = {
              'package.json', 'README.md', 'LICENSE', 'NOTICE',
              'src/index.ts', 'src/world.ts', 'lib/index.js',
              'tools/build.mjs', 'tsconfig.vendor.json',
              'console.js', 'console.d.ts', 'styles.css', 'describe.json',
          }
          
          def fail(message):
              raise RuntimeError(message)
          
          def verify_destination(root, parts):
              target = root
              for index, part in enumerate(parts):
                  target = target / part
                  if target.is_symlink():
                      fail('An import destination contains a symbolic link.')
                  if target.exists():
                      mode = target.stat().st_mode
                      if index < len(parts) - 1 and not stat.S_ISDIR(mode):
                          fail('An import parent is not a directory.')
                      if index == len(parts) - 1 and not stat.S_ISREG(mode):
                          fail('An import file destination is not a regular file.')
              if not target.resolve().is_relative_to(root):
                  fail('An import destination escapes the checkout.')
              return target
          
          def import_archive(archive, expected_sha256, root):
              if not re.fullmatch(r'[0-9a-f]{64}', expected_sha256) or expected_sha256 == '0' * 64:
                  fail('Set the final literal source ZIP SHA256 before dispatching.')
              if archive.is_symlink() or not archive.is_file() or archive.stat().st_size > MAX_ARCHIVE_BYTES:
                  fail('The fixed source ZIP is unavailable or exceeds its size limit.')
              digest = hashlib.sha256()
              with archive.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(block)
              if digest.hexdigest() != expected_sha256:
                  fail('The source ZIP does not match the sealed SHA256.')
          
              with zipfile.ZipFile(archive) as package:
                  entries = package.infolist()
                  if len(entries) > 1024:
                      fail('The source ZIP contains too many archive entries.')
                  files = []
                  names = set()
                  spellings = {}
                  all_entries = set()
                  total = 0
                  members = set()
                  for entry in entries:
                      if entry.orig_filename != entry.filename:
                          fail('The source ZIP contains a truncated member name.')
                      if entry.filename in members:
                          fail('The source ZIP contains a duplicate member.')
                      members.add(entry.filename)
                      kind = stat.S_IFMT(entry.external_attr >> 16)
                      allowed_kinds = {0, stat.S_IFDIR} if entry.is_dir() else {0, stat.S_IFREG}
                      if kind not in allowed_kinds or entry.flag_bits & 1:
                          fail('Links, special files and encrypted ZIP entries are forbidden.')
                      if entry.compress_type not in {zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED}:
                          fail('The source ZIP uses an unsupported compression method.')
                      if not entry.filename.startswith(ARCHIVE_ROOT):
                          fail('The source ZIP does not use the fixed enclosing directory.')
                      member = entry.filename[len(ARCHIVE_ROOT):]
                      if not member and entry.is_dir():
                          continue
                      raw = member[:-1] if entry.is_dir() else member
                      if not raw or chr(92) in raw or raw.startswith('/') or ':' in raw:
                          fail('The source ZIP contains an invalid or absolute member path.')
                      if unicodedata.normalize('NFC', raw) != raw or any(unicodedata.category(c) in {'Cc', 'Cf'} for c in raw):
                          fail('The source ZIP contains a noncanonical member path.')
                      parts = raw.split('/')
                      if any(part in {'', '.', '..'} or part.casefold() == '.git' for part in parts):
                          fail('The source ZIP contains a traversal or Git metadata path.')
                      path = PurePosixPath(raw)
                      if str(path) != raw or raw in all_entries:
                          fail('The source ZIP contains a duplicate or noncanonical path.')
                      all_entries.add(raw)
                      for length in range(1, len(parts) + 1):
                          spelling = '/'.join(parts[:length])
                          previous = spellings.setdefault(spelling.casefold(), spelling)
                          if previous != spelling:
                              fail('The source ZIP contains paths that collide by case.')
                      if parts[0] not in TREES and (entry.is_dir() or len(parts) != 1 or raw not in ROOT_FILES):
                          fail('The source ZIP contains a path outside the fixed source allowlist.')
                      if entry.is_dir():
                          continue
                      if not 0 <= entry.file_size <= MAX_FILE_BYTES:
                          fail('A source file exceeds its expanded size limit.')
                      total += entry.file_size
                      if total > MAX_EXPANDED_BYTES:
                          fail('The source ZIP exceeds its expanded size limit.')
                      names.add(raw)
                      files.append((raw, parts, entry))
                  if len(files) != MAX_FILES or not REQUIRED.issubset(names):
                      fail('The ZIP file count or required source set is invalid.')
                  if any(not any(name.startswith(tree + '/') for name in names) for tree in TREES):
                      fail('A required source tree is absent.')
                  for raw, parts, _ in files:
                      if any('/'.join(parts[:i]) in names for i in range(1, len(parts))):
                          fail('A source file is also used as a directory.')
                      verify_destination(root, parts)
          
                  # All paths are validated before writing. No ZIP extractall(),
                  # package manager, build, test, source import or source script runs.
                  for raw, parts, entry in files:
                      target = verify_destination(root, parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      content = package.read(entry)
                      if len(content) != entry.file_size:
                          fail('A ZIP member has an unexpected expanded length.')
                      with target.open('wb') as output:
                          output.write(content)
                      target.chmod(0o644)
              return sorted(names)
          
          
          import urllib.request
          
          
          import json
          import shutil
          
          INTEGRATION_GUIDE = r'''# Optional Task Supervisor World for Coopanion
          
          This directory contains the complete source and built runtime of **cortico-world-task-supervisor 0.1.0-preview.2**, an optional World API 6 extension. It combines scoped DSH/Codex task monitoring, approved conversation control, DSH external-memory tools, an important-event queue and the owner's QQ task channel in one World.
          
          Its setup page, in-World installation guidance and human-facing World metadata support all eleven host languages: Simplified Chinese, Traditional Chinese, English, Japanese, Korean, French, German, Latin American Spanish, Brazilian Portuguese, Italian and Russian. The separately run DSH installer retains English terminal prompts. Tool/model instructions remain English, and local paths, commands, IDs and source conversation content retain their original values.
          
          The [pinned workspace list](https://github.com/YuZhou0311/Coopanion/blob/ff30069db35cd96ce57be6f034fc8b5057f24075/pnpm-workspace.yaml) contains only packages/*. This optional integrations directory is outside that workspace glob. The contribution preserves the application source, Cortico submodule, root dependencies/lockfile, default Worlds and startup behavior.
          
          ## Provenance
          
          - Canonical project: [rtmhjx/cortico-world-task-supervisor](https://github.com/rtmhjx/cortico-world-task-supervisor).
          - Reviewed preview.2 archive: [immutable publication commit](https://github.com/rtmhjx/cortico-world-task-supervisor/blob/85492b5a9f4d388da55372fd017ea5deae40876b/cortico-world-task-supervisor-0.1.0-preview.2-source.zip).
          - Source ZIP SHA256: **a3da12dc299fc222ce8b76774928a6bfc58867af2e2d50944182c0e1fe74585a**.
          - Complete package tree: **150** files; this integration guide is one additional file.
          - Original host base: **ff30069db35cd96ce57be6f034fc8b5057f24075**, Coopanion 0.2.4.
          - Previous contribution: **b1bfbcea347472312dcd6a50e6dc29afa1adaf33**. The refresh descends directly from it; temporary workflows on the fork main do not enter the PR.
          - Pinned Cortico: **087289dfcdf262a771c573d16dbaf2392ce6764b**, version 0.2.3 / API 6, unchanged.
          - Package licensing and provenance: [LICENSE](LICENSE), [NOTICE](NOTICE), [THIRD-PARTY-LICENSES.txt](THIRD-PARTY-LICENSES.txt) and [SOURCES.md](SOURCES.md).
          
          ## Install and configure
          
          Use Node 24 for the extension build and separate gateway installer. Build this optional package directory explicitly:
          
              npm install
              npm run build
          
          Open Coopanion **Advanced mode → Extensions** and use its existing local-directory installer to select this directory. Restart when requested, enable **Task Supervisor** in **World Overview**, and open its setup page. After publication to the npm registry your host uses, the same Extensions page can install **cortico-world-task-supervisor** by package name. Copying this source directory does not publish, install or enable it.
          
          The setup page lets you select the owner QQ, underlying loopback QQ service, permitted DSH/Codex workspaces and conversation directories, exclusions and individual optional read/write functions. Credentials remain host-managed deployment data. Do not store credentials in the repository. Check each configured connection and follow the page's save/restart guidance.
          
          Raw transport provides the owner task conversation and fixed-owner replies without requiring another QQ World. Native SnowLuma mode requires the included native add-on helper; it is not a stock SnowLuma API. OneBot v11 is an optional transport. Advanced trusted-metadata mode instead reuses a compatible QQ World. Avoid two reply owners for the same private conversation.
          
          DSH control requires a separate running DSH host with the conversation gateway. The setup page generates a private local installation kit and launcher; generating it is not installation. Run it locally, select the DSH home/profile, confirm the installation, restart DSH as required and check authenticated health. Codex-only read monitoring does not require a fictitious DSH workspace, but native control remains unavailable until its required gateway/application is ready.
          
          ## Reporting and authorization
          
          Reporting and model task-access tools default **OFF**. Only the configured owner's genuine private message beginning with **#@**, or consisting of that marker, toggles access. Nicknames, quotes, forwards, transcriptions and later mentions of the marker do not provide a switch command. The setup panel displays status rather than toggling access.
          
          ON injects queued important events and allows completion/approval/problem reports. Ordinary progress does not become a notification stream. Raw-mode ordinary owner chat is ignored while OFF, and task-content reads/delivery through this World remain closed. The switch is not task confirmation: submission still needs a separate fresh owner confirmation.
          
          Changing owner or permitted scope establishes a new OFF queue and closes the previous access. Already submitted native operations continue in their coding application. Scoped reads are not an OS sandbox for submitted commands, and selected conversation content can reach the configured model service. See [SECURITY.md](SECURITY.md).
          
          ## Validation evidence
          
          | Check | Observed evidence | Boundary |
          | --- | --- | --- |
          | Preview.2 complete extension suite | **298 tests: 297 passed, zero failed, one skipped**. Includes all 22 UI tests, a real World metadata check across all eleven language strings and seven DSH prepared-session cases. | The skip is unavailable Windows file-symlink permission; DSH persistence is synthetic/in-memory. |
          | Two actual SDK source typechecks | Both Cortico 0.2.6 and the fork's 0.2.3 passed, each covering 82 source/fixture seeds. | Typechecking is distinct from execution and live deployment. |
          | Two actual SDK isolated integration probes and upstream extension-check | Real World assembly, synthetic secret/persistence/restart contracts, string-language metadata, five dry-mount checks and the upstream extension checker passed for both SDKs. | The checker used its actual SDK's public builtin dependency graph; no real Minecraft/QQ/DSH service was started. |
          | Target-fork host plus sealed preview.2 optional integration | All five requested commands passed: test 285 passed/one filesystem-case skip, test:worlds 158 passed, and typecheck/typecheck:web/typecheck:worlds exit 0. | Isolated working tree on previous PR head b1bfbcea, whose original host base is ff30069d; this is not a claim about the final public refresh commit. Host test configurations exclude this external integration package. |
          | Host setup frontend | Official Coopanion 0.2.8 settings frontend displayed the World against an isolated Cortico 0.2.6 WebApp. | Browser/settings integration, not full Electron startup. |
          
          Host checks used Node 24 on Windows, synthetic profile/data/temp directories, the unchanged frozen host lock and the exact locked Electron 44.4.4 only as Node for a loopback fixture. They are not the upstream Node 22 cross-platform CI matrix. Preview.2's own suite and SDK checks are separate from those host checks.
          
          Validation records retain two earlier failures: the previous-head test initially lacked its documented pet-panel build prerequisite, and the preview.2 host's concurrent first run timed out while checking a nonexistent extension and hit a Windows cleanup EPERM. Only the isolated pet bundle prerequisite was built. The unchanged complete main suite then passed when rerun separately with the same test timeout and selection; host/vendor source was not patched.
          
          **Full Electron application startup, real QQ delivery/control, production DSH execution and prolonged stability remain unverified.** Keep this preview optional until those deployment-specific acceptance steps are completed.
          
          ## Maintenance
          
          Develop future versions in the canonical project. Review each sealed source archive and checksum, preserve its complete tree and licenses, then refresh this optional integration and its guide in a dedicated PR. Do not include submodule upgrades, host dependency changes or default startup changes in a package refresh.
          '''
          
          SOURCE_COMMIT = '85492b5a9f4d388da55372fd017ea5deae40876b'
          SOURCE_SHA256 = 'a3da12dc299fc222ce8b76774928a6bfc58867af2e2d50944182c0e1fe74585a'
          SOURCE_FILE_COUNT = 150
          SOURCE_BYTES = 1282301
          MAX_FILES = SOURCE_FILE_COUNT
          
          UPSTREAM_BASE = 'ff30069db35cd96ce57be6f034fc8b5057f24075'
          OLD_HEAD = 'b1bfbcea347472312dcd6a50e6dc29afa1adaf33'
          FORK_URL = 'https://github.com/rtmhjx/Coopanion.git'
          BRANCH = 'task-supervisor-world'
          INTEGRATION = 'integrations/task-supervisor/'
          SOURCE_URL = 'https://raw.githubusercontent.com/rtmhjx/cortico-world-task-supervisor/' + SOURCE_COMMIT + '/cortico-world-task-supervisor-0.1.0-preview.2-source.zip'
          
          def validate_release():
              if (not re.fullmatch('[0-9a-f]{40}', SOURCE_COMMIT) or
                  not re.fullmatch('[0-9a-f]{64}', SOURCE_SHA256) or SOURCE_SHA256 == '0' * 64 or
                  not isinstance(SOURCE_FILE_COUNT, int) or not 150 <= SOURCE_FILE_COUNT <= 200 or
                  MAX_FILES != SOURCE_FILE_COUNT or not isinstance(SOURCE_BYTES, int) or not 0 < SOURCE_BYTES <= MAX_ARCHIVE_BYTES or
                  'REPLACE_WITH_' in INTEGRATION_GUIDE):
                  fail('The preview.2 sealed release literals are incomplete; dispatch is forbidden.')
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, new_url):
                  fail('The fixed archive URL redirected; another URL is forbidden.')
          
          def download_archive(path):
              if path.exists() or path.is_symlink():
                  fail('The temporary archive path already exists.')
              request = urllib.request.Request(SOURCE_URL, headers={'User-Agent': 'reviewed-task-supervisor-refresh/1', 'Accept': 'application/octet-stream'})
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
                  if response.status != 200 or response.geturl() != SOURCE_URL:
                      fail('The fixed archive response was rejected.')
                  size = 0
                  with path.open('xb') as output:
                      while block := response.read(1024 * 1024):
                          size += len(block)
                          if size > SOURCE_BYTES:
                              fail('The archive exceeds the sealed length.')
                          output.write(block)
              if size != SOURCE_BYTES:
                  fail('The archive length differs from its sealed value.')
              return path
          
          def git(*args, capture=False):
              return subprocess.run(['git', '-c', 'core.hooksPath=' + os.devnull, '-c', 'core.autocrlf=false', '-c', 'commit.gpgSign=false', *args],
                                    check=True, stdout=subprocess.PIPE if capture else None).stdout
          
          def branch_is_unchanged():
              value = git('ls-remote', '--heads', 'origin', 'refs/heads/' + BRANCH, capture=True).decode().strip()
              if value.split() != [OLD_HEAD, 'refs/heads/' + BRANCH]:
                  fail('The remote contribution branch changed; refusing the refresh.')
          
          def tracked_paths(ref):
              return {item.decode('utf-8') for item in git('ls-tree', '-r', '--name-only', '-z', ref, '--', INTEGRATION, capture=True).split(b'\0') if item}
          
          def verify_target(root):
              target = root
              for part in ['integrations', 'task-supervisor']:
                  target = target / part
                  if target.is_symlink() or not target.is_dir() or not target.resolve().is_relative_to(root):
                      fail('The existing integration directory is missing or has an invalid ancestor.')
              return target
          
          def push_guard_source(new_head):
              expected = repr((FORK_URL, 'refs/heads/' + BRANCH, OLD_HEAD, new_head))
              return '#!/usr/bin/env python3\nimport sys\nexpected = ' + expected + r'''
          lines = [line.split() for line in sys.stdin if line.strip()]
          ok = (len(sys.argv) == 3 and sys.argv[1:] == ['origin', expected[0]] and
                len(lines) == 1 and len(lines[0]) == 4 and
                lines[0][1] == expected[3] and lines[0][2] == expected[1] and lines[0][3] == expected[2])
          if not ok:
              print('The advertised branch changed; the refresh push was refused.', file=sys.stderr)
              sys.exit(1)
          '''
          
          def main():
              # Validate all placeholders before Git, network, extraction or checkout writes.
              validate_release()
              if (os.environ.get('GITHUB_REPOSITORY') != REPOSITORY or os.environ.get('GITHUB_REPOSITORY_OWNER') != 'rtmhjx' or
                  os.environ.get('GITHUB_REF') != 'refs/heads/main' or os.environ.get('GITHUB_EVENT_NAME') != 'workflow_dispatch'):
                  fail('Only the fixed fork main manual dispatch is permitted.')
              root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
              if Path.cwd().resolve() != root:
                  fail('The refresh is not inside its fixed checkout.')
              if git('rev-parse', 'HEAD', capture=True).decode().strip() != OLD_HEAD or git('status', '--porcelain', capture=True):
                  fail('The checkout must be clean at the exact previous contribution head.')
              if git('rev-parse', 'HEAD^', capture=True).decode().strip() != UPSTREAM_BASE:
                  fail('The previous contribution no longer has its expected upstream parent.')
              if git('remote', 'get-url', 'origin', capture=True).decode().strip() not in {FORK_URL, FORK_URL[:-4]}:
                  fail('The checkout remote is not the fixed fork.')
              git('remote', 'set-url', 'origin', FORK_URL)
              git('remote', 'set-url', '--push', 'origin', FORK_URL)
              branch_is_unchanged()
              target = verify_target(root)
              old_inventory = tracked_paths(OLD_HEAD)
              if len(old_inventory) != 149:
                  fail('The previous contribution does not have its fixed 149-file inventory.')
              temporary = Path(os.environ['RUNNER_TEMP']).resolve()
              archive = download_archive(temporary / 'task-supervisor-preview2-source.zip')
              staging = temporary / 'task-supervisor-preview2-extracted'
              staging.mkdir(exist_ok=False)
              names = import_archive(archive, SOURCE_SHA256, staging)
              manifest = json.loads((staging / 'package.json').read_text(encoding='utf-8'))
              if manifest.get('name') != 'cortico-world-task-supervisor' or manifest.get('version') != '0.1.0-preview.2':
                  fail('The sealed archive manifest is not the expected package version.')
              (staging / 'COO-INTEGRATION.md').write_text(INTEGRATION_GUIDE, encoding='utf-8', newline='\n')
              files = sorted([INTEGRATION + name for name in names] + [INTEGRATION + 'COO-INTEGRATION.md'])
              inventory = set(files)
              if len(files) != SOURCE_FILE_COUNT + 1 or not old_inventory.issubset(inventory):
                  fail('The new full inventory would drop a previous contribution file.')
              git('switch', '--create', BRANCH, OLD_HEAD)
              for relative in files:
                  parts = relative.split('/')
                  destination = verify_destination(root, parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(staging / relative[len(INTEGRATION):], destination)
                  destination.chmod(0o644)
              paths = temporary / 'task-supervisor-preview2-paths.nul'
              paths.write_bytes(b''.join(name.encode('utf-8') + b'\0' for name in files))
              git('--literal-pathspecs', 'add', '--force', '--pathspec-from-file=' + str(paths), '--pathspec-file-nul')
              staged = {item.decode('utf-8') for item in git('diff', '--cached', '--name-only', '-z', capture=True).split(b'\0') if item}
              if not staged or not staged.issubset(inventory):
                  fail('The staged changes are empty or outside the exact new inventory.')
              git('-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com',
                  'commit', '--no-verify', '--no-gpg-sign', '-m', 'feat: update optional Task Supervisor World to preview.2')
              if git('rev-parse', 'HEAD^', capture=True).decode().strip() != OLD_HEAD:
                  fail('The refresh commit does not directly descend from the old PR head.')
              changed = {item.decode('utf-8') for item in git('diff', '--name-only', '--no-renames', '-z', UPSTREAM_BASE, 'HEAD', capture=True).split(b'\0') if item}
              if changed != inventory or tracked_paths('HEAD') != inventory:
                  fail('The final contribution differs from the exact full new source and guide.')
              branch_is_unchanged()
              new_head = git('rev-parse', 'HEAD', capture=True).decode().strip()
              hooks = temporary / 'task-supervisor-refresh-trusted-hooks'
              hooks.mkdir(exist_ok=False)
              hook = hooks / 'pre-push'
              hook.write_text(push_guard_source(new_head), encoding='utf-8', newline='\n')
              hook.chmod(0o755)
              # Only this trusted inline guard is enabled for push. No downloaded/source hook runs.
              # Its advertised-old-OID check plus Git's receive update lock closes the check/push race.
              git('-c', 'core.hooksPath=' + str(hooks), 'push', 'origin', 'HEAD:refs/heads/' + BRANCH)
              print('Refreshed the fixed branch with', SOURCE_FILE_COUNT, 'package files and one guide.')
          
          if __name__ == '__main__':
              main()
          PY
